[package]
name = "openwa"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

description = "Official-grade Rust client library for the OpenWA WhatsApp API Gateway"
license = "MIT OR Apache-2.0"
repository = "https://github.com/simplebash-official/openwa-rs"
readme = "README.md"
keywords = ["openwa", "whatsapp", "client", "sdk", "api"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "time", "macros", "fs", "io-util"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
url = "2.5"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.5"
hex = "0.4"
base64 = "0.22"
tracing = { version = "0.1", default-features = false }
futures-util = { version = "0.3", default-features = false }

# Optional feature dependencies
tokio-tungstenite = { version = "0.23", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots", "handshake"] }
axum = { version = "0.7", optional = true, default-features = false }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.38", features = ["full"] }
tracing-subscriber = "0.3"
tower = { version = "0.5", features = ["util"] }

[features]
default = []
events = ["dep:tokio-tungstenite"]
axum = ["dep:axum"]
